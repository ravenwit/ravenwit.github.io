    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.0/p5.min.js" integrity="sha512-tGZFF1kxT/c9C+kv77mKkZ9Ww1VyU8TMX6HLUSzbPrDLuptbiRFBfti8A33ip+BBIHYUsybuZD9OKLmIqdLmaQ==" crossorigin="anonymous"></script>
    <!-- particles.js lib - https://github.com/VincentGarreau/particles.js -->

    <!-- stats.js lib -->
    <!-- <script src="http://threejs.org/examples/js/libs/stats.min.js"></script> -->
    <!-- <script src="./jquery-3.6.0.min.js"></script> -->
    <!-- <script src="./p5.min.js"></script> -->
    <script src="./preloader.js"></script>
    <script src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
    <canvas id="preloader" width="150" height="150">
        Your browser does not support the HTML5 canvas tag.
    </canvas>

    <div class="web-content">

        <!-- particles.js container -->
        <div id="particles-js"></div>
        <!-- stats - count particles -->
        <!-- <div class="count-particles"> <span class="js-count-particles">--</span> particles </div> -->

        <main>
            <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Very_Large_Telescope_Ready_for_Action_%28ESO%29.jpg">-->
            <img class="ex-image" src="http://cdn.mos.cms.futurecdn.net/M7fDTpDnJcZ4dt3myngzxi.jpg">
        </main>
    </div>

    <script>
        $('#preloader').preloadinator({
            scroll: false,
            minTime: 2000,
            animation: 'fadeOut',
            afterRemovePreloader: function() {
                $('.web-content').fadeIn('slow');
                $('#preloader').remove();
            }
        });
    </script>
    <!-- <script src="./script.js"></script> -->
</body>
